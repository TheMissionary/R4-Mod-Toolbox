    <title>R4 Mod Toolbox</title>
    
    <script>
      // Synchronously load the user's accent color before the DOM renders to prevent color flashing
      try {
        const settings = localStorage.getItem('cp2077_theme_settings_v2');
        if (settings) {
          const parsed = JSON.parse(settings);
          const mode = parsed.mode || 'dark';
          const colors = mode === 'light' ? parsed.lightColors : parsed.darkColors;
          if (colors && colors.accent) {
            document.documentElement.style.setProperty('--splash-accent', colors.accent);
          }
        }
      } catch (e) {}
    </script>
