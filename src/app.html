<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R4 Mod Manager</title>
    
    <script>
      // Synchronously load the user's theme settings before the DOM renders to achieve an instant, solid-state splash screen
      try {
        const settings = localStorage.getItem('cp2077_theme_settings_v3');
        if (settings) {
          const parsed = JSON.parse(settings);
          
          // 1. Inject Accent Color
          if (parsed && parsed.accentHex) {
            document.documentElement.style.setProperty('--splash-accent', parsed.accentHex);
          }
          
          // 2. Calculate and Inject Background & Text Colors based on Mode and Atmosphere
          const mode = parsed.mode || 'dark';
          const atmosphere = parsed.atmosphere || 'graphite';
          
          let bg = '#121517';
          let text = '#ffffff';
          
          if (mode === 'light') {
            text = '#0f172a';
            if (atmosphere === 'pearl') bg = '#ffffff';
            else if (atmosphere === 'cloud') bg = '#f3f4f6';
            else if (atmosphere === 'frost') bg = '#f1f5f9';
            else if (atmosphere === 'parchment') bg = '#fdfbf7';
            else bg = '#f3f4f6'; // fallback light
          } else {
            text = '#ffffff';
            if (atmosphere === 'obsidian') bg = '#000000';
            else if (atmosphere === 'slate') bg = '#0f172a';
            else if (atmosphere === 'graphite') bg = '#121517';
            else if (atmosphere === 'mocha') bg = '#1c1917';
            else bg = '#121517'; // fallback dark
          }
          
          document.documentElement.style.setProperty('--splash-bg', bg);
          document.documentElement.style.setProperty('--splash-text', text);
        }
      } catch (e) {}
    </script>

    <style>
      @font-face {
        font-family: 'Geist';
        src: url('%sveltekit.assets%/fonts/Geist-Bold.woff2') format('woff2');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --splash-accent: #76b900; /* Fallback default */
        --splash-bg: #121517;     /* Fallback default */
        --splash-text: #ffffff;   /* Fallback default */
      }

      /* Ensure window body starts with the exact theme background instantly */
      body {
        background-color: var(--splash-bg);
        margin: 0;
        overflow: hidden;
      }

      /* Raw HTML splash overlay: 100% opaque, zero blur, instant render */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: var(--splash-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }

      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60vw;
        gap: 4vw;
      }

      .splash-badge {
        height: 15vw;
        width: 15vw;
        background-color: var(--splash-accent);
        border-radius: 2.5vw;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 8vw;
        letter-spacing: -0.03em;
        box-shadow: 0 1vw 4vw rgba(0, 0, 0, 0.7);
        flex-shrink: 0;
      }

      .splash-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.5vw;
        height: 13vw;
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--splash-text);
        line-height: 0.85;
        text-align: left;
      }

      .splash-text .line-1 {
        font-size: 6vw;
        letter-spacing: 0.07em;
      }

      .splash-text .line-2 {
        font-size: 6vw;
        letter-spacing: 0.07em;
      }
    </style>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Instant startup title screen -->
    <div id="app-splash">
      <div class="splash-lockup">
        <div class="splash-badge">R4</div>
        <div class="splash-text">
          <span class="line-1">R4 MOD</span>
          <span class="line-2">MANAGER</span>
        </div>
      </div>
    </div>

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
