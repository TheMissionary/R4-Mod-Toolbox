<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RED4 Mod Toolbox</title>
    
    <style>
      /* Ensure window body starts dark instantly to eliminate white flashes */
      body {
        background-color: #101418;
        margin: 0;
        overflow: hidden;
      }

      /* Raw HTML splash overlay: visible before JavaScript boots */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #101418;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }

      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-lockup {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .splash-badge {
        height: 3.6rem;
        width: 3.6rem;
        background-color: #76b900;
        border-radius: 0.65rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 1.95rem;
        letter-spacing: -0.03em;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        flex-shrink: 0;
      }

      .splash-text {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 3.6rem;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        color: #ffffff;
        line-height: 1;
        text-align: left;
      }

      .splash-text .line-1 {
        font-size: 1.55rem;
        letter-spacing: 0.07em;
      }

      .splash-text .line-2 {
        font-size: 1.55rem;
        letter-spacing: 0.07em;
      }
    </style>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Instant startup title screen -->
    <div id="app-splash">
      <div class="splash-lockup">
        <div class="splash-badge">R4</div>
        <div class="splash-text">
          <span class="line-1">RED4 MOD</span>
          <span class="line-2">TOOLBOX</span>
        </div>
      </div>
    </div>

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
